name: ETF discount alert

# Triggers twice every trading day, Mon-Fri, IST:
#   10:00 IST and 14:30 IST
#
# Scheduling is handled by cron-job.org, which posts to the workflow_dispatch
# REST API at those exact times (see README -> "Scheduling (cron-job.org)").
# GitHub's own schedule() trigger is intentionally NOT used: with both enabled
# every run would fire twice and you would get two Telegram messages.
# The commented block below is the UTC equivalent if you ever want to go back
# to the built-in scheduler (it can lag 5-30 min and pauses after 60 days of
# repo inactivity).
on:
  # schedule:
  #   - cron: "30 4 * * 1-5"   # 10:00 IST
  #   - cron: "0 9 * * 1-5"    # 14:30 IST
  workflow_dispatch:
    inputs:
      stale_ok:
        description: "Send even if the NSE snapshot is not from today (manual test)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: etf-nav-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check ETF discounts and alert on Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STALE_OK: ${{ github.event_name == 'workflow_dispatch' && inputs.stale_ok && '1' || '' }}
        run: node check-etf-nav.js
